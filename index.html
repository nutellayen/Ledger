<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#14213d;--mute:#5b6b85;--line:#d9e0ea;--acc:#14213d;--paid:#1f8a5b;--paidbg:#e3f4ec;--pend:#b3261e;--pendbg:#fdeceb;--unp:#8a6200;--unpbg:#fff3d1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1420;--card:#18212f;--ink:#e8edf5;--mute:#93a1b8;--line:#2a3548;--acc:#e8edf5;--paid:#5fd09a;--paidbg:#143226;--pend:#ff8a80;--pendbg:#3a1a1a;--unp:#f1c45a;--unpbg:#3a2f12}}
:root[data-theme="dark"]{--bg:#0e1420;--card:#18212f;--ink:#e8edf5;--mute:#93a1b8;--line:#2a3548;--acc:#e8edf5;--paid:#5fd09a;--paidbg:#143226;--pend:#ff8a80;--pendbg:#3a1a1a;--unp:#f1c45a;--unpbg:#3a2f12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 90px}
.hd{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
h1{font:700 26px/1.1 Georgia,"Times New Roman",serif;margin:0}
.chip{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--acc);color:var(--bg);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-weight:600}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.box small{color:var(--mute);display:block}
.box b{font-size:18px;display:block;margin-top:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:20px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.banner{background:var(--unpbg);color:var(--unp);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.job{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--unp);border-radius:12px;padding:12px;margin-bottom:10px}
.job.Overdue{border-left-color:var(--pend);background:var(--pendbg)}
.job.Paid{border-left-color:var(--paid)}
.job.Void{border-left-color:var(--mute);opacity:.8}
.job.Void .name{text-decoration:line-through}
.top{display:flex;justify-content:space-between;gap:8px}
.name{font-weight:650}
.co{color:var(--mute);font-size:14px}
.amt{text-align:right;font-weight:700;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{font-size:12.5px;padding:2px 8px;border-radius:10px;background:var(--bg);color:var(--mute)}
.tag.Unpaid,.tag.Pending{background:var(--unpbg);color:var(--unp)}.tag.Overdue{background:var(--pend);color:#fff}.tag.Paid{background:var(--paidbg);color:var(--paid)}
.tag.tax{background:var(--acc);color:var(--bg)}
.note{font-size:13.5px;color:var(--mute);margin-bottom:8px;white-space:pre-wrap;word-break:break-word}
.acts{display:flex;gap:8px;flex-wrap:wrap}
button.b{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
button.b.go{background:var(--paid);border-color:var(--paid);color:#fff}
button.b.danger{background:var(--pend);border-color:var(--pend);color:#fff}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--bg);border:0;border-radius:28px;padding:14px 20px;font:inherit;font-weight:650;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.open{display:flex}
#dlg{z-index:40}
#drawer{justify-content:flex-start;align-items:stretch}
.side{background:var(--card);width:82%;max-width:320px;overflow:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.side h2{margin:0 0 10px;font-size:19px}
.side button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.side button.on{font-weight:700;background:var(--bg)}
.side i{font-style:normal;color:var(--mute)}.side i.r{color:var(--pend);font-weight:700}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 10px;font-size:19px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--mute)}
label.full,.g.full{grid-column:1/-1}
input,select,textarea{width:100%;margin-top:3px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
select#yr{width:auto;margin:6px 0}
label.ck{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px}
label.ck input{width:auto;margin:0}
.calc{grid-column:1/-1;font-size:14px;color:var(--mute)}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.row .b{flex:1;padding:11px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px;word-break:break-word}
.sheet h3{margin:16px 0 6px;font-size:16px}
select#ts{width:auto;margin:6px 0}
.fab.l{right:auto;left:16px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
<div class="hd"><button class="b" id="menu" aria-label="Companies">☰</button><h1>Hustle Ledger</h1><button class="b go" id="saveall" style="margin-left:auto">Save all</button></div>

<input id="q" type="search" placeholder="Search jobs, companies, notes" style="width:100%;margin:0 0 10px">
<div class="tabs" id="tabs"></div>
<div id="banner"></div>
<div id="list"></div>

<div class="acts" id="xp" style="margin-top:18px"><button class="b" data-x="csv">Export CSV</button><button class="b" data-x="xlsx">Export Excel</button><button class="b" data-x="imx">Import Excel / CSV</button><button class="b" data-x="json">Save backup</button></div>

<div class="modal" id="modal"><div class="sheet">
<h2 id="mt">Add job</h2>
<div class="g">
<label class="full">Job / task name<input id="name" placeholder="User interview"></label>
<label>Company<select id="company"><option value="">Select</option></select></label>
<label>Payout method<select id="method"><option>PayPal</option><option>Bank Transfer</option><option>Hyperwallet</option><option>Payoneer</option><option>Gift Card</option></select></label>
<label>Job email<select id="mail"><option value="">Not set</option><option>oing.natalie@gmail.com</option><option>crescent.local1@gmail.com</option><option>kelvinkken@gmail.com</option><option>Crescent26cm@hotmail.com</option></select></label>
<label id="bkw">Bank<select id="bank"><option value="">Not set</option><option>Monzo</option><option>Halifax</option><option>HSBC</option></select></label>
<label id="ppw">PayPal account<select id="pp"><option value="">Not set</option><option>ausiko0730@gmail.com</option><option>oing.natalie@gmail.com</option></select></label>
<label>Currency<select id="cur"><option>GBP</option><option>USD</option><option>HKD</option><option>EUR</option><option>CAD</option></select></label>
<label>Amount<input id="gross" type="number" step="0.01" inputmode="decimal"></label>
<label>Offer / start date<input id="start" type="date"></label>
<label>Expected pay date<input id="exp" type="date"></label>

<label>Date received (when paid)<input id="recv" type="date"></label>
<div class="g full" id="gcw"><label>Gift card status<select id="gc"><option>Not Claimed</option><option>Claimed</option></select></label><label>Claimed date<input id="gcd" type="date"></label></div>
<label class="ck full"><input type="checkbox" id="tax"> Taxable (needs Self Assessment)</label>
<div class="calc" id="net"></div>
<label>Label (your own)<input id="lb" list="lbl" placeholder="Chase, Tax, Call back"></label><label>Flag<select id="fg"><option value="">No flag</option><option value="red">Red</option><option value="amber">Amber</option><option value="green">Green</option><option value="blue">Blue</option><option value="purple">Purple</option></select></label><label class="full">Remind me on<input id="rm" type="date"></label><datalist id="lbl"></datalist>
<label class="full">Notes / remarks<textarea id="notes" rows="6" placeholder="Paste emails, links, tax reminders…"></textarea></label>
</div>
<div class="row"><button class="b danger" id="mdel" style="display:none">Delete</button><button class="b" id="cancel">Cancel</button><button class="b go" id="save">Save</button></div>
</div></div>

<div class="modal" id="dlg"><div class="sheet"><h2 id="dt"></h2><div id="db"></div><div class="row" id="dbtn"></div></div></div>

<script>
var KEY='hustle-ledger-v1',jobs=[],tab='all',editId=null,yr='all',co='all',cl=[],ts='all',curTax=null;
try{jobs=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){jobs=[]}
var FB=null,AUTH=null,FS=null,UID=null,dbReady=false,dbT=null,lastJ={},lastM='',unsubJ=null,unsubM=null;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(jobs))}catch(e){}dbQueue()}
function dbQueue(){if(!dbReady)return;clearTimeout(dbT);dbT=setTimeout(dbSave,600)}
function setSync(t,mode){var e=$('sync');if(e)e.innerHTML=esc(t)+(mode?' ('+jobs.length+' records)':'')+(mode==='in'?' <button class="b go" id="signin">Sign in with Google</button>':mode==='out'?' <button class="b" id="signout">Sign out</button>':'')}
function uref(){return FS.collection('users').doc(UID)}
async function dbSave(){
  dbT=null;if(!dbReady)return;
  try{
    var ops=[],pend={},cur={};
    jobs.forEach(function(j){var s=JSON.stringify(j);cur[j.id]=1;if(lastJ[j.id]!==s){ops.push(['s',j.id,s]);pend[j.id]=s}});
    Object.keys(lastJ).forEach(function(id){if(!cur[id]){ops.push(['d',id]);pend[id]=null}});
    var th='';try{th=localStorage.getItem(TK)||''}catch(e){}
    var m=JSON.stringify({ls:LS,th:th}),metaOp=m!==lastM;
    setSync('Saving...');
    for(var i=0;i<ops.length;i+=400){
      var batch=FS.batch();
      ops.slice(i,i+400).forEach(function(o){var r=uref().collection('jobs').doc(o[1]);if(o[0]==='s')batch.set(r,{d:o[2],t:Date.now()});else batch.delete(r)});
      await batch.commit();
    }
    Object.keys(pend).forEach(function(id){if(pend[id]===null)delete lastJ[id];else lastJ[id]=pend[id]});
    if(metaOp){await uref().collection('meta').doc('settings').set({ls:JSON.stringify(LS),th:th});lastM=m}
    setSync('Saved to your account. '+(AUTH.currentUser.email||''),'out')
  }catch(e){setSync('Could not save to your account ('+((e&&e.code)||'error')+'). Still saved on this device.','out')}
}
function listen(){
  var firstJ=true;
  if(unsubJ)unsubJ();if(unsubM)unsubM();
  unsubJ=uref().collection('jobs').onSnapshot(function(snap){
    var map={},changed=false;jobs.forEach(function(j){map[j.id]=j});
    snap.docChanges().forEach(function(ch){
      var id=ch.doc.id;
      if(ch.type==='removed'){if(map[id]){delete map[id];changed=true}delete lastJ[id];return}
      var s=ch.doc.data().d;if(lastJ[id]===s)return;
      try{map[id]=JSON.parse(s);lastJ[id]=s;changed=true}catch(e){}
    });
    if(changed){var seen={},out=[];jobs.forEach(function(j){if(map[j.id]){out.push(map[j.id]);seen[j.id]=1}});Object.keys(map).forEach(function(id){if(!seen[id])out.push(map[id])});jobs=out;try{localStorage.setItem(KEY,JSON.stringify(jobs))}catch(e){}render()}
    if(firstJ&&!snap.metadata.fromCache){firstJ=false;dbReady=true;dbSave()}
    else if(firstJ&&snap.metadata.fromCache){dbReady=true;setSync('Synced with your account (offline copy)','out')}
    else if(!snap.metadata.hasPendingWrites)setSync('Synced with your account. '+(AUTH.currentUser.email||''),'out')
  },function(e){setSync('Sync problem ('+((e&&e.code)||'error')+'). Saved on this device.','out')});
  unsubM=uref().collection('meta').doc('settings').onSnapshot(function(d){
    if(d.metadata.hasPendingWrites||!d.exists)return;var x=d.data();
    try{var ls=JSON.parse(x.ls),m=JSON.stringify({ls:ls,th:x.th||''});if(m===lastM)return;LS=ls;localStorage.setItem(LK,x.ls);lastM=m;if(x.th)applyTheme(x.th);render()}catch(e){}
  });
}
function signIn(){var p=new firebase.auth.GoogleAuthProvider();AUTH.signInWithPopup(p).catch(function(e){if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'))AUTH.signInWithRedirect(p);else setSync('Sign-in problem: '+((e&&e.code)||'error'),'in')})}
function dbInit(){
  $('sync').onclick=function(e){if(e.target.id==='signin')signIn();if(e.target.id==='signout'&&AUTH)AUTH.signOut()};
  if(!window.firebase||!window.FIREBASE_CONFIG||String(FIREBASE_CONFIG.apiKey||'').indexOf('PASTE')===0){setSync('Sync is not set up yet. Saved on this device only.');return}
  try{
    firebase.initializeApp(FIREBASE_CONFIG);AUTH=firebase.auth();FS=firebase.firestore();
    FS.enablePersistence({synchronizeTabs:true}).catch(function(){});
    AUTH.getRedirectResult().catch(function(e){setSync('Sign-in problem: '+((e&&e.code)||'error'),'in')});
    AUTH.onAuthStateChanged(function(u){
      if(unsubJ){unsubJ();unsubJ=null}if(unsubM){unsubM();unsubM=null}
      if(!u){UID=null;dbReady=false;setSync('Saved on this device only.','in');return}
      UID=u.uid;setSync('Connecting...');listen();
    });
  }catch(e){setSync('Saved on this device only.')}
}
var $=function(i){return document.getElementById(i)};
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){if(!s)return null;var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function due(j){if(j.exp)return pd(j.exp);var s=pd(j.start);if(!s||!j.term)return null;s.setDate(s.getDate()+(+j.term));return s}
function eff(j){if(j.void)return 'Void';if(j.status==='Paid')return 'Paid';var d=due(j);if(d&&d<today())return 'Overdue';return j.status}
function net(j){return +j.gross||0}
function money(n,c){return c+' '+n.toFixed(2)}
function fmt(d){return d?d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):''}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ty(j){var d=pd(j.recv)||pd(j.exp)||pd(j.start);if(!d)return '';var y=d.getFullYear();if(d<new Date(y,3,6))y--;return y+'-'+(y+1)}
function find(id){return jobs.filter(function(j){return j.id===id})[0]}
function tx(j){if(!j.tx)j.tx={st:'To report',sub:'',done:'',exp:[],docs:[]};return j.tx}
function exTot(j){return tx(j).exp.reduce(function(a,x){return a+(+x.a||0)},0)}
var cyf='all';
function yearOf(j){return (j.recv||j.exp||j.start||'').slice(0,4)}
function yrOK(j){return cyf==='all'||yearOf(j)===cyf}
function mine(j){return (co==='all'||j.company===co)&&yrOK(j)}

function dlg(t,body,btns){
  $('dt').textContent=t;$('db').innerHTML=body;$('dbtn').innerHTML='';
  btns.forEach(function(b){var e=document.createElement('button');e.className='b '+(b.c||'');e.textContent=b.l;
    e.onclick=function(){if(b.f&&b.f()===false)return;$('dlg').classList.remove('open')};$('dbtn').appendChild(e)});
  $('dlg').classList.add('open');
}

function render(){
  $('yrbar').innerHTML='<select id="cyf" style="width:auto;margin:0 0 10px">'+['all','2024','2025','2026','2027'].map(function(y){return '<option value="'+y+'"'+(y===cyf?' selected':'')+'>'+(y==='all'?'All years':y)+'</option>'}).join('')+'</select>';
  var L=jobs.filter(function(j){return !j.void&&mine(j)&&j.kind!=='expense'}),owed={},got={};
  L.forEach(function(j){var m=eff(j)==='Paid'?got:owed;m[j.cur]=(m[j.cur]||0)+net(j)});
  function lines(m){var k=Object.keys(m);return k.length?k.map(function(c){return money(m[c],c)}).join('<br>'):'Nothing'}
  $('cochip').innerHTML=co==='all'?'':'<div class="chip">'+esc(co)+'<button class="b" id="clr">Show all</button></div>';
  var allT={};Object.keys(owed).concat(Object.keys(got)).forEach(function(c){allT[c]=(owed[c]||0)+(got[c]||0)});
  var sumHtml='<div class="box"><small>Still to receive</small><b>'+lines(owed)+'</b></div><div class="box"><small>Received</small><b>'+lines(got)+'</b></div><div class="box" style="grid-column:1/-1"><small>All time total (received + still to receive)</small><b>'+lines(allT)+'</b></div>';
  var one=function(m){var k=Object.keys(m);return k.length?k.map(function(c){return money(m[c],c)}).join(' · '):'nothing'};
  $('sum').innerHTML='<button class="b" id="sumtog" style="width:100%;text-align:left;display:flex;justify-content:space-between;gap:8px;padding:8px 12px;font-size:13px"><span><b>Totals</b> <span style="color:var(--mute)">received '+one(got)+' · to receive '+one(owed)+'</span></span><span>'+(sumOpen?'▴':'▾')+'</span></button>'+(sumOpen?'<div class="sum" style="margin:8px 0 0;gap:8px">'+sumHtml.replace(/<b>/g,'<b style="font-size:15px">')+'</div>':'');
  $('sumtog').onclick=function(){sumOpen=!sumOpen;render()};
  var LA=L.filter(function(j){return !isDone(j)}),DN=L.filter(isDone);
  var over=LA.filter(function(j){return eff(j)==='Overdue'}).length;
  var taxN=L.filter(function(j){return j.tax}).length;
  var gcN=L.filter(function(j){return j.method==='Gift Card'&&j.gc==='Not Claimed'}).length;
  var stN=jobs.filter(function(j){return j.void&&mine(j)}).length;var EX=jobs.filter(function(j){return j.kind==='expense'&&yrOK(j)});var RM=jobs.filter(function(j){return !j.void&&j.kind!=='expense'&&!isDone(j)&&(j.rm||j.fg)||(j.kind==='expense'&&(j.rm||j.fg))});
  var defs=[['all','All ('+LA.length+')'],['done','Completed ('+DN.length+')'],['over','Overdue ('+over+')'],['tax','Tax ('+taxN+')'],['gift','Gift card vault ('+gcN+')'],['rem','Reminders ('+RM.length+')'],['exp','Expenses ('+EX.length+')'],['chart','Chart'],['struck','Struck out ('+stN+')']];
  $('tabs').innerHTML=defs.map(function(d){return '<button data-t="'+d[0]+'" class="'+(tab===d[0]?'on':'')+'">'+d[1]+'</button>'}).join('');
  var f=tab==='struck'?jobs.filter(function(j){return j.void&&mine(j)}):(tab==='done'?DN.slice():(tab==='all'||tab==='over')?LA.slice():L.slice());
  if(tab==='exp')f=EX.slice();if(tab==='rem')f=RM.slice();
  if(tab==='over')f=f.filter(function(j){return eff(j)==='Overdue'});
  if(tab==='tax'){f=f.filter(function(j){return j.tax});if(yr!=='all')f=f.filter(function(j){return ty(j)===yr});if(ts!=='all')f=f.filter(function(j){return tx(j).st===ts})}
  if(tab==='gift')f=f.filter(function(j){return j.method==='Gift Card'&&j.gc==='Not Claimed'});
  var order={Overdue:0,Pending:1,Unpaid:2,Paid:3,Void:4};
  var lastD=function(j){var v=j.recv||j.exp||j.start||'';return v};
  f.sort(function(a,b){var x=lastD(a),y=lastD(b);return x<y?1:x>y?-1:0});

function toIso(v){v=String(v==null?'':v).trim();if(!v)return '';var m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);

function rowToJob(r,i){
  var g={};Object.keys(r).forEach(function(k){g[k.toLowerCase().replace(/[^a-z]/g,'')]=r[k]});

  var amt=parseFloat(pick('amount','gross','value').replace(/[^0-9.\-]/g,''));

  var gc=pick('giftcard','gc');gc=/^claimed/i.test(gc)?'Claimed':/not/i.test(gc)?'Not Claimed':'N/A';
  var cur=pick('currency','cur').toUpperCase().slice(0,3)||'GBP';
